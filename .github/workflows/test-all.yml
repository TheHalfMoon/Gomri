name: Test All Applications

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-repository-tools:
    name: Test repository tooling
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repository tests
        run: npm test

      - name: Install presentation export runtime
        run: npm run sync:presentation-export

      - name: Verify presentation export runtime
        run: npm run check:presentation-export

  test-fastapi:
    name: Test FastAPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servers/fastapi
    env:
      APP_DATA_DIRECTORY: /tmp/presenton-app-data
      TEMP_DIRECTORY: /tmp/presenton-temp
      DATABASE_URL: sqlite+aiosqlite:////tmp/presenton-test.db
      DISABLE_ANONYMOUS_TRACKING: "true"
      DISABLE_IMAGE_GENERATION: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: servers/fastapi/uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --dev

      - name: Create test directories
        run: mkdir -p "$APP_DATA_DIRECTORY" "$TEMP_DIRECTORY"

      - name: Run all pytest tests
        run: uv run --locked python -m pytest --verbose --tb=short

  test-nextjs:
    name: Test Next.js
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servers/nextjs

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: servers/nextjs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Node.js tests
        run: npm test

      - name: Run ESLint
        run: npm run lint

      - name: Build application
        env:
          NEXT_PUBLIC_FAST_API: http://localhost:8000
          NEXT_PUBLIC_URL: http://localhost:3000
        run: npm run build

      - name: Run Cypress component tests
        run: npx cypress run --component --browser electron

  test-electron:
    name: Test Electron
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: electron

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install dependencies without packaging hooks
        run: npm ci --ignore-scripts

      - name: Typecheck Electron
        run: npm run typecheck

      - name: Compile Electron main process
        run: npm run build:ts

      - name: Check Electron main globals
        run: npm run check:main-no-undef

      - name: Test Electron app path migration
        run: npm run test:path-migration

  g4-baseline:
    name: G4 engineering baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Run root contract tests
        run: npm test

      - name: Validate platform-support matrix
        run: node scripts/check-platform-support.mjs

      - name: Validate release configuration dry-run
        run: node scripts/validate-release-config.mjs

      - name: Validate release manifest binding
        run: node scripts/generate-release-manifest.mjs --check-only

      - name: Validate fixture policy
        run: node scripts/check-fixtures.mjs

      - name: Generate SBOMs without omission
        run: node scripts/generate-sbom.mjs

  security-baseline:
    name: Security baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Secret scan of repository-owned changes
        run: node scripts/scan-secrets.mjs

      - name: Audit root dependencies
        run: |
          npm audit --audit-level=high --json > /tmp/gomrey-audit-root.json || true
          node scripts/check-dependency-audit.mjs root /tmp/gomrey-audit-root.json

      - name: Audit Electron dependencies
        run: |
          npm audit --prefix electron --audit-level=high --json > /tmp/gomrey-audit-electron.json || true
          node scripts/check-dependency-audit.mjs electron /tmp/gomrey-audit-electron.json

      - name: Audit Next.js dependencies
        run: |
          npm audit --prefix servers/nextjs --audit-level=high --json > /tmp/gomrey-audit-nextjs.json || true
          node scripts/check-dependency-audit.mjs nextjs /tmp/gomrey-audit-nextjs.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: servers/fastapi/uv.lock

      - name: Verify Python lockfile is pinned
        working-directory: servers/fastapi
        run: uv sync --locked --dev

      - name: Audit Python dependencies with pip-audit
        working-directory: servers/fastapi
        run: uv run --with pip-audit pip-audit --desc --local

  sbom-baseline:
    name: SBOM baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Generate deterministic SBOMs
        run: node scripts/generate-sbom.mjs

      - name: Generate release manifest binding
        run: |
          mkdir -p dist
          node scripts/generate-release-manifest.mjs > dist/release-manifest.json
          node scripts/generate-release-manifest.mjs --check-only

      - name: Upload SBOM and release manifest
        uses: actions/upload-artifact@v4
        with:
          name: gomrey-sbom-release-baseline
          path: |
            sbom/*.cdx.json
            sbom/manifest.json
            dist/release-manifest.json
          if-no-files-found: error

  qualify-windows:
    name: Qualify Windows (bounded)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Run root contract tests
        run: npm test

      - name: Validate platform-support matrix
        run: node scripts/check-platform-support.mjs

      - name: Validate release configuration dry-run
        run: node scripts/validate-release-config.mjs

  qualify-macos:
    name: Qualify macOS (bounded)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Run root contract tests
        run: npm test

      - name: Validate platform-support matrix
        run: node scripts/check-platform-support.mjs

      - name: Validate release configuration dry-run
        run: node scripts/validate-release-config.mjs
