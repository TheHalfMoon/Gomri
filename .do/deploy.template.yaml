spec:
  name: gomrey
  region: nyc
  services:
    - name: gomrey
      image:
        registry_type: GHCR
        registry: ghcr.io
        repository: thehalfmoon/gomrey
        # P02-G4 replaces this placeholder only after a Gomrey image is qualified.
        tag: replace-with-qualified-release
      http_port: 80
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-2gb
      envs:
        - key: MIGRATE_DATABASE_ON_STARTUP
          value: "true"
          scope: RUN_TIME
          type: GENERAL
        - key: START_OLLAMA
          value: "false"
          scope: RUN_TIME
          type: GENERAL
  alerts:
    - rule: DEPLOYMENT_FAILED
    - rule: DOMAIN_FAILED
